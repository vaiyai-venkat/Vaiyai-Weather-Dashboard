name: Update weather & deploy Pages

on:
  push:
    branches: [main]

  schedule:
    - cron: '7,37 * * * *'

  workflow_dispatch:
    inputs:
      start_date:
        description: 'Optional backfill start (YYYY-MM-DD)'
        required: false
        type: string

      max_backfill:
        description: 'Manual historical collection: 1–366 older days; 0 refreshes today only'
        default: '0'
        type: string

permissions:
  contents: read

# Concurrency is configured separately for each job below.
jobs:
  collect:
    name: Collect and save weather data
    runs-on: ubuntu-latest
    timeout-minutes: 35

    permissions:
      contents: write

    concurrency:
      group: weather-data-collection
      cancel-in-progress: false

    # No github-pages environment here.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify collector
        run: python -m unittest discover -s tests -v

      - name: Collect station observations
        id: collect
        continue-on-error: true
        env:
          WU_API_KEY: ${{ secrets.WU_API_KEY }}
          WU_INSTALLATION_DATE: ${{ vars.WU_INSTALLATION_DATE }}
          START_DATE: ${{ inputs.start_date }}
          MAX_BACKFILL: ${{ github.event_name == 'workflow_dispatch' && inputs.max_backfill || '0' }}
        run: |
          args=(--max-backfill "$MAX_BACKFILL")
          if [ -n "$START_DATE" ]; then
            args+=(--start-date "$START_DATE")
          fi
          if [ "$MAX_BACKFILL" -eq 0 ]; then
            args+=(--live-only)
          fi
          python collector.py "${args[@]}"

      - name: Save observation archive
        run: |
          git config user.name "Weather archive bot"
          git config user.email "weather-bot@users.noreply.github.com"
          git add dist/data
          if ! git diff --cached --quiet; then
            git commit -m "Update IPAPAN3 observations [skip ci]"
            git push origin main
          fi

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Report collection issue
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::warning::Weather collection failed; retained observations were packaged."

  deploy:
    name: Publish dashboard
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    concurrency:
      group: weather-pages-deployment
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
